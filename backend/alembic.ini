# alembic.ini
# Alembic configuration file.
#
# What Alembic does:
#   Manages database schema changes (table creation, column additions, etc.)
#   through versioned migration scripts. Instead of manually running SQL,
#   you edit models.py -> run alembic revision --autogenerate ->
#   alembic detects the change and writes a migration script ->
#   alembic upgrade head applies it to the DB.
#
# Why not just use Base.metadata.create_all()?
#   create_all() creates tables that don't exist, but CANNOT modify existing tables.
#   If you add a column to UserProfile after the table already exists,
#   create_all() silently does nothing. Alembic generates ALTER TABLE statements.
#
# DATABASE_URL override:
#   We set sqlalchemy.url to a placeholder. The actual URL is set in
#   alembic/env.py using the DATABASE_URL environment variable (same as FastAPI).
#   This way, alembic and FastAPI always use the same DB connection string.
#
# Usage (run from the backend/ directory):
#   First time:
#     alembic init alembic       <- creates alembic/ directory (already done)
#     alembic revision --autogenerate -m "initial tables"
#     alembic upgrade head
#
#   After editing models.py:
#     alembic revision --autogenerate -m "add column X to user_profiles"
#     alembic upgrade head
#
#   Roll back one step:
#     alembic downgrade -1

[alembic]
# Migration script location
# Where Alembic looks for migration scripts (the versions/ subfolder)
script_location = alembic

# Migration file naming
# %%(rev)s = short revision hash (e.g. a3f8b2)
# %%(slug)s = slugified message (e.g. initial_tables)
# Example filename: a3f8b2_initial_tables.py
file_template = %%(rev)s_%%(slug)s

# Database URL
# Overridden in alembic/env.py to use the DATABASE_URL environment variable.
# This value is only used if env.py doesn't override it.
sqlalchemy.url = postgresql+psycopg2://foodapp:foodapp123@localhost:5432/food_recommendation

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

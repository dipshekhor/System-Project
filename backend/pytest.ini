# pytest.ini
# ─────────────────────────────────────────────────────────────────────────────
# Pytest configuration for the FastAPI backend tests.
#
# Place this file in backend/ (same level as the app/ folder).
#
# Key settings:
#   asyncio_mode = auto
#     Makes ALL async test functions work without needing to add
#     @pytest.mark.asyncio to every single test.
#     Requires pytest-asyncio >= 0.21.
#
#   testpaths
#     Tells pytest where to look for tests.
#     Without this, pytest searches the whole project and may find
#     unintended test files.
#
#   filterwarnings
#     Suppresses known harmless deprecation warnings from SQLAlchemy
#     and asyncio that would clutter test output.
# ─────────────────────────────────────────────────────────────────────────────

[pytest]
asyncio_mode = auto

testpaths = app/tests

filterwarnings =
    ignore::DeprecationWarning
    ignore::sqlalchemy.exc.SAWarning

# Show short test summary for failed/error tests
addopts = -v --tb=short
